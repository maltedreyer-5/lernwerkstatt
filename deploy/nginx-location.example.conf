# Example nginx locations for LernWerkstatt under the path /lernwerkstatt.
# Include inside an existing `server { ... }` block and set APP_ROOT_PATH to
# the same prefix. Replace 127.0.0.1:7860 with the address of the container
# if nginx runs in the same Docker network.
#
# The application has no user accounts. Restrict access here, for example
# with your single sign-on, `auth_basic`, or `allow`/`deny` for your network.
# client_max_body_size must be at least APP_MAX_UPLOAD_MB.

location ^~ /lernwerkstatt/assets/ {
    # Static front-end files: GET only, no request body.
    proxy_pass http://127.0.0.1:7860/lernwerkstatt/assets/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
}

location ^~ /lernwerkstatt/gradio_api/ {
    client_max_body_size 50M;
    proxy_pass http://127.0.0.1:7860/lernwerkstatt/gradio_api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /lernwerkstatt;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_request_buffering off;
    # Production streams progress events over this route. These timeouts
    # limit idle time between events, not the total duration of a job.
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
}

location ^~ /lernwerkstatt/file/ {
    client_max_body_size 50M;
    proxy_pass http://127.0.0.1:7860/lernwerkstatt/file/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /lernwerkstatt;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
}

location ^~ /lernwerkstatt/ {
    client_max_body_size 50M;
    proxy_pass http://127.0.0.1:7860/lernwerkstatt/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /lernwerkstatt;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
}

location = /lernwerkstatt {
    return 301 /lernwerkstatt/;
}
