name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: |
          pip install -r requirements-dev.txt
          npm ci --no-audit --no-fund
          node scripts/copy_vendor.mjs
          python -m playwright install --with-deps chromium

      - name: Static check (Python)
        run: python scripts/check_static.py

      - name: Lint (JavaScript)
        run: node scripts/lint_js.mjs

      - name: Third-party notices up to date
        run: |
          node scripts/third_party_notices.mjs
          git diff --exit-code THIRD_PARTY_NOTICES.md

      - name: Tests
        run: PYTHON=python bash run_tests.sh

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Build image
        run: docker build -t lernwerkstatt:ci .

      - name: Start and wait for the health check
        run: |
          docker run -d --name lw -p 127.0.0.1:7860:7860 \
            -e LLM1_BASE_URL=http://127.0.0.1:9/v1 -e LLM1_MODEL=none \
            lernwerkstatt:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' lw)
            [ "$status" = healthy ] && break
            sleep 5
          done
          docker logs lw | grep '\[startup\]'
          [ "$(docker inspect -f '{{.State.Health.Status}}' lw)" = healthy ]
